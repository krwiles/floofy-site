<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FloofySite</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Disallow friendly scrapers from using images for AI training -->
    <meta name="robots" content="noai, noimageai, noindex, noimageindex" />

    <!-- Preload the main image with high priority -->
    <link rel="preload" as="image" href="assets/G8s5y4ZakAA0XN9.jpeg" fetchpriority="high" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Fonts (moved out of styles.css's @import so it doesn't render-block the CSS pipeline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;600;700;800&display=swap"
    />

    <!-- Load the twitter embed JavaScript file -->
    <script async src="https://platform.twitter.com/widgets.js"></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

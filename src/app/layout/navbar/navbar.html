<nav
  class="nav-intro glass-bgx fixed inset-s-0 top-0 z-100 w-full border-b border-border bg-bg"
  [class.rounded-b-2xl]="isMenuOpen()"
>
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between px-4 py-1">
    <app-brand class="nav-brand-intro" />
    <div class="nav-actions-intro flex items-center space-x-1 lg:order-2 lg:space-x-0 rtl:space-x-reverse">
      <app-language-toggle />
      <button
        #menuButton
        type="button"
        (click)="toggleMenu()"
        class="inline-flex h-10 w-10 items-center justify-center rounded-xl border border-border bg-brand-subtle p-2 text-sm text-on-light-heading transition-colors hover:bg-brand focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-strong lg:hidden"
        aria-controls="navbar-language"
        [attr.aria-expanded]="isMenuOpen()"
      >
        <span class="sr-only">Open main menu</span>
        <svg
          class="h-6 w-6"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14" />
        </svg>
      </button>
    </div>
    <div
      #menuPanel
      class="w-full items-center justify-between lg:order-1 lg:flex lg:w-auto"
      [class.hidden]="!isMenuOpen()"
      id="navbar-language"
    >
      <ul
        class="nav-links-intro mt-4 flex flex-col rounded-xl border border-border p-4 font-medium lg:mt-0 lg:flex-row lg:space-x-8 lg:border-0 lg:p-0 rtl:space-x-reverse"
      >
        @for (item of i18n.nav(); track item.key) {
          <li>
            <a
              [routerLink]="item.route"
              routerLinkActive="bg-brand-subtle text-brand lg:bg-transparent lg:text-brand"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="closeMenu()"
              class="block rounded px-3 py-2 text-on-light-heading transition-colors hover:text-brand lg:border-0 lg:p-0 lg:hover:bg-transparent lg:hover:text-brand"
            >
              {{ item.label }}
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</nav>

<!-- Dims the rest of the page while the mobile menu is open, same treatment as the gallery lightbox's
     own overlay (bg-black/80). Sits below `<nav>` (z-90 vs. its z-100) so the navbar itself -- brand,
     language toggle, the menu button, and the menu panel's own links -- all stay fully lit and
     clickable above it. A plain click anywhere on it closes the menu, same as tapping outside the
     lightbox's image closes that.

     Fades in (shared .overlay-fade-in, motion.css) but disappears instantly on close, with no
     matching leave animation: closing can happen mid-navigation (a tapped link starts routing the same
     instant it closes the menu), and an animated fade-out has no way to know the new page's content
     might already be painting underneath it -- an animated close was tried and visibly lingered as a
     darkening film over the freshly-routed page. -->
@if (isMenuOpen()) {
  <div class="fixed inset-0 z-90 bg-black/80 lg:hidden" (click)="closeMenu()" animate.enter="overlay-fade-in"></div>
}

<!-- The whole strip is aria-hidden: it's decoration, and the "See full gallery" link beside it leads to the
     same images. -->
<div
  class="rolling-carousel"
  [class.rolling-carousel--framed]="cardTone()"
  [style.height]="height()"
  aria-hidden="true"
>
  <div class="rolling-carousel__track" [style.animation-duration.s]="speed()">
    @for (image of images(); track 'a-' + $index) {
      @if (cardTone()) {
        <div appCard [tone]="cardTone()!" [noBackground]="true" class="rolling-carousel__frame">
          <img
            [ngSrc]="image.src"
            [alt]="image.alt"
            [width]="image.width"
            [height]="image.height"
            class="rolling-carousel__image"
          />
        </div>
      } @else {
        <img
          [ngSrc]="image.src"
          [alt]="image.alt"
          [width]="image.width"
          [height]="image.height"
          class="rolling-carousel__image"
        />
      }
    }
    <!-- Duplicate copy, identical order -- makes the CSS loop's endpoint land on an identical frame. -->
    @for (image of images(); track 'b-' + $index) {
      @if (cardTone()) {
        <div appCard [tone]="cardTone()!" [noBackground]="true" class="rolling-carousel__frame">
          <img
            [ngSrc]="image.src"
            [alt]="image.alt"
            [width]="image.width"
            [height]="image.height"
            class="rolling-carousel__image"
          />
        </div>
      } @else {
        <img
          [ngSrc]="image.src"
          [alt]="image.alt"
          [width]="image.width"
          [height]="image.height"
          class="rolling-carousel__image"
        />
      }
    }
  </div>
</div>

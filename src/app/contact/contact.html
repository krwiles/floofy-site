<!-- Contact Hero -->
<app-parallax-section
  class="bg-hero-contact"
  [backgroundImage]="'assets/intersecting-circles.svg'"
  [backgroundSize]="'100px'"
  [backgroundHeight]="'200%'"
  [parallaxStrength]="0.8"
  [ariaLabel]="'Hero Background'"
>
  <div class="absolute inset-0 mx-auto h-full max-w-7xl">
    <app-parallax-section
      class="absolute inset-0 h-full max-w-4xl lg:mask-fade-x"
      [ariaLabel]="'Hero section'"
      [backgroundImage]="'assets/G1yNfrpbAAAEPTp.jfif'"
      [backgroundPosition]="'center 50%'"
      [backgroundHeight]="'110%'"
      [parallaxStrength]="0.65"
    ></app-parallax-section>
  </div>
  <div
    class="relative z-10 mx-auto flex min-h-screen w-full max-w-7xl items-end justify-center text-left md:min-h-[95svh] md:justify-end"
  >
    <div appCard [glass]="true" class="hero-reveal-surface max-w-3xl px-6 py-6 drop-shadow-md sm:px-7 sm:py-7 md:mb-16">
      <app-flourish variant="full" class="absolute top-0 left-1/2 z-10 hidden h-12 -translate-x-1/2 -translate-y-1/2 text-on-dark-heading md:inline-block" />
      <p
        class="hero-reveal-kicker mb-3 text-sm font-bold tracking-[0.32em] text-on-dark-heading uppercase sm:text-[0.95rem]"
      >
        {{ 'contact.hero.kicker' | translate }}
      </p>
      <h1
        class="hero-reveal-title text-[clamp(3.4rem,10vw,6.75rem)] leading-[0.9] font-black tracking-[0.02em] text-on-dark-heading uppercase"
      >
        {{ 'contact.hero.title' | translate }}
      </h1>
      <p class="hero-reveal-copy mt-4 max-w-[56ch] text-sm leading-7 text-on-dark-heading sm:text-base">
        {{ 'contact.hero.description' | translate }}
      </p>
      <p
        class="hero-reveal-copy mt-6 text-xs font-semibold tracking-[0.28em] text-on-dark-heading uppercase sm:text-sm"
      >
        {{ 'contact.hero.tagline' | translate }}
      </p>
    </div>
  </div>
</app-parallax-section>

<app-section-divider />

<!-- Contact Form Section -->
<app-section tone="light" pattern="stars" ariaLabel="General Inquiry Form">
  <div class="mx-auto max-w-7xl px-4 py-24 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-3xl">
      <!-- Section heading -->
      <app-section-header
        [eyebrow]="'contact.form.kicker' | translate"
        [title]="'contact.form.title' | translate"
        [description]="'contact.form.description' | translate"
        tone="middle"
      />

      <!-- Contact form -->
      <form
        appCard
        tone="middle"
        class="mx-auto max-w-3xl px-8 py-12 text-on-middle-heading"
        [formRoot]="contactForm"
      >
        <div class="grid grid-cols-1 gap-6">
          <!-- name field -->
          <div>
            <label class="text-sm font-semibold">
              <p class="flex gap-2">
                Name
                <span class="text-error" aria-hidden="true">*</span>
                @if (contactForm.name().invalid() && contactForm.name().touched()) {
                  <div class="text-error">
                    @for (error of contactForm.name().errors(); track error.kind) {
                      <span>{{ error.message }}</span>
                    }
                  </div>
                }
              </p>
              <input
                type="text"
                [formField]="contactForm.name"
                placeholder="Enter your name or username"
                class="mt-2 w-full rounded-xl border border-border bg-section-light p-3 placeholder:text-on-middle-body-subtle focus-visible:outline-2 focus-visible:outline-brand-strong"
              />
            </label>
          </div>

          <!-- email field -->
          <div>
            <label class="text-sm font-semibold">
              <p class="flex gap-2">
                Email
                <span class="text-error" aria-hidden="true">*</span>
                @if (contactForm.email().invalid() && contactForm.email().touched()) {
                  <div class="text-error">
                    @for (error of contactForm.email().errors(); track error.kind) {
                      <span>{{ error.message }}</span>
                    }
                  </div>
                }
              </p>
              <input
                type="email"
                [formField]="contactForm.email"
                placeholder="Enter your email address"
                class="mt-2 w-full rounded-xl border border-border bg-section-light p-3 placeholder:text-on-middle-body-subtle focus-visible:outline-2 focus-visible:outline-brand-strong"
              />
            </label>
          </div>

          <!-- Message field -->
          <div>
            <label class="text-sm font-semibold">
              <p class="flex gap-2">
                Message
                <span class="text-error" aria-hidden="true">*</span>
                @if (contactForm.message().invalid() && contactForm.message().touched()) {
                  <div class="text-error">
                    @for (error of contactForm.message().errors(); track error.kind) {
                      <span>{{ error.message }}</span>
                    }
                  </div>
                }
              </p>
              <textarea
                [formField]="contactForm.message"
                placeholder="Write your message for Floofy."
                rows="5"
                class="mt-2 w-full rounded-xl border border-border bg-section-light p-3 placeholder:text-on-middle-body-subtle focus-visible:outline-2 focus-visible:outline-brand-strong"
              ></textarea>
            </label>
          </div>
        </div>

        <!-- Submit button -->
        <div class="flex items-center gap-5 pt-4 text-on-middle-body">
          <button
            type="submit"
            appButton
            variant="primary"
            tone="middle"
            class="shrink-0 whitespace-nowrap"
          >
            {{ 'contact.form.submit' | translate }}
          </button>
          <p class="min-w-0 flex-1 text-sm font-semibold wrap-break-word" id="contact-status">
            {{ status() }}
          </p>
        </div>
      </form>
    </div>
  </div>
</app-section>

<!-- Contact Socials -->
<app-section tone="middle">
  <div class="mx-auto max-w-7xl px-4 py-24 sm:px-6 lg:px-8">
    <div appCard tone="middle" class="relative mx-auto max-w-3xl px-5 py-8 sm:px-7">
      <app-flourish variant="full" class="absolute top-0 left-1/2 z-10 hidden h-12 -translate-x-1/2 -translate-y-1/2 text-on-middle-heading md:inline-block" />

      <!-- Section heading -->
      <app-section-header
        [eyebrow]="'contact.socials.kicker' | translate"
        [title]="'contact.socials.title' | translate"
        [description]="'contact.socials.description' | translate"
        tone="middle"
        [flourish]="false"
      />

      <div
        class="grid grid-cols-2 gap-3 text-on-light-heading sm:grid-cols-2 md:grid-cols-4 md:gap-4"
        role="list"
        aria-label="Social links"
      >
        <app-social-links [ids]="['x', 'bsky', 'vgen', 'email']" variant="chip" />
      </div>
    </div>
  </div>
</app-section>

<!-- Donate Hero -->
<app-parallax-section
  class="bg-white"
  [backgroundImage]="'assets/4-point-stars.svg'"
  [backgroundSize]="'100px'"
  [backgroundHeight]="'200%'"
  [parallaxStrength]="0.8"
  [ariaLabel]="'Hero Background'"
>
  <div class="absolute inset-0 mx-auto h-full max-w-7xl">
    <app-parallax-section
      class="absolute inset-0 ml-auto h-full max-w-3xl lg:mask-fade-x"
      [ariaLabel]="'Hero section'"
      [backgroundImage]="'assets/GyfSzJfaIAAn9qh.jfif'"
      [backgroundPosition]="'center 33%'"
      [backgroundHeight]="'110%'"
      [parallaxStrength]="0.65"
    ></app-parallax-section>
  </div>
  <div
    class="relative z-10 mx-auto flex min-h-screen w-full max-w-7xl items-end justify-center text-left md:min-h-[95svh] md:justify-start"
  >
    <div appCard [glass]="true" class="hero-reveal-surface max-w-2xl px-6 py-6 drop-shadow-md sm:px-7 sm:py-7 md:mb-16">
      <app-flourish variant="full" class="absolute top-0 left-1/2 z-10 hidden h-12 -translate-x-1/2 -translate-y-1/2 text-on-light-heading md:inline-block" />
      <p
        class="hero-reveal-kicker mb-3 text-sm font-bold tracking-[0.32em] text-on-light-heading uppercase sm:text-[0.95rem]"
      >
        {{ 'donate.hero.kicker' | translate }}
      </p>
      <h1
        class="hero-reveal-title text-[clamp(3.4rem,10vw,6.75rem)] leading-[0.9] font-black tracking-[0.02em] text-on-light-heading uppercase"
      >
        {{ 'donate.hero.title' | translate }}
      </h1>
      <p class="hero-reveal-copy mt-4 max-w-[56ch] text-sm leading-7 text-on-light-body sm:text-base">
        {{ 'donate.hero.description' | translate }}
      </p>
      <p class="hero-reveal-copy mt-6 text-xs font-semibold tracking-[0.28em] text-on-light-body uppercase sm:text-sm">
        {{ 'donate.hero.tagline' | translate }}
      </p>
    </div>
  </div>
</app-parallax-section>

<app-section-divider />

<!-- Ko-fi donation section -->
<app-section tone="light">
  <div class="mx-auto max-w-7xl items-center px-4 py-8 sm:py-16 lg:px-6">
    <!-- Section heading -->
    <app-section-header
      eyebrow="Support My Art"
      title="Ko-fi"
      description="Thank you for considering supporting my art! Your donations help me continue creating content and improving my work. Every contribution, big or small, is greatly appreciated and goes a long way in helping me achieve my goals."
      tone="light"
      [flourish]="false"
    />

    <!-- Ko-fi Embed -->
    <div class="relative mt-4 flex justify-center pb-6 md:mt-0">
      <app-flourish variant="full" class="absolute top-0 left-1/2 z-10 hidden h-12 -translate-x-1/2 -translate-y-1/2 text-on-light-heading md:inline-block" />
      <div appCard tone="middle" class="w-lg max-w-full p-1">
        <!-- appCard's fill/border paint via a ::before layer, which browsers never render on replaced elements
             like <iframe> -- the directive has to live on this wrapper div instead, with the iframe as plain
             content, or the card's whole surface silently never appears (found in code review). -->
        <iframe
          id="kofiframe"
          src="https://ko-fi.com/summerfloofy/?hidefeed=true&widget=true&embed=true&preview=true"
          height="712"
          title="summerfloofy"
          class="w-full"
        ></iframe>
      </div>
    </div>

    <!-- Ko-fi Direct Link -->
    <div appCard tone="middle" class="mx-auto max-w-lg px-5 py-4 sm:px-6 sm:py-5">
      <div class="flex items-center justify-between gap-2">
        <p class="min-w-0 text-sm leading-6 font-semibold text-on-middle-body sm:text-base">
          Prefer to use the Ko-fi site? Visit my page~
        </p>
        <a
          href="https://ko-fi.com/summerfloofy"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="SummerFloofy on Ko-fi"
          class="inline-flex shrink-0 items-center justify-center rounded-2xl border border-border bg-white/65 px-4 py-3 text-on-middle-heading transition-colors hover:bg-brand-subtle focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-strong sm:px-5"
        >
          <span class="social-icon social-icon--kofi text-4xl sm:text-5xl" aria-hidden="true"></span>
        </a>
      </div>
    </div>
  </div>
</app-section>

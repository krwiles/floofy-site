<!-- Streaming Hero. Every string below (kicker, description, title, both CTA labels) is hardcoded
     English, not translate-piped, unlike every other page's hero -- pre-existing i18n gap, carried
     over unchanged from the markup this replaced, left alone per the same reasoning as the hardcoded
     text in reviews.html (content not finalized yet; Phase 7 sweeps this). -->
<app-hero
  backgroundClass="bg-hero-streaming"
  backgroundPatternImage="assets/intersecting-circles.svg"
  heroImageSrc="assets/G0iHCdnaIAA5IDY.jpg"
  heroImagePosition="center 40%"
  heroImageHeight="110%"
  heroImageMaxWidthClass="max-w-5xl"
  tone="dark"
  cardAlign="start"
  cardMaxWidthClass="max-w-3xl"
  titleClass="text-[clamp(3.2rem,7vw,5.5rem)] leading-[0.9] font-black tracking-[0.02em] uppercase"
  kicker="Live on Twitch"
  description="SummerFloofy usually streams on Saturdays at 11:00 AM EST, with a cozy mix of drawing, chatting, games, and art updates."
>
  <span heroTitle>Join the stream</span>
  <div heroActions class="hero-reveal-copy mt-6 flex flex-wrap items-center gap-3">
    <a [href]="twitchUrl" target="_blank" rel="noopener noreferrer" class="stream-cta stream-cta--primary">
      Watch on Twitch
    </a>
    <a href="#schedule" class="stream-cta stream-cta--secondary">See schedule</a>
  </div>
</app-hero>

<app-section-divider />

<section id="schedule" class="bg-section-light">
  <div class="mx-auto max-w-6xl px-4 py-16 sm:px-6 lg:px-8">
    <div class="mb-10 text-center">
      <p class="mb-2 text-sm font-semibold tracking-[0.35em] text-on-light-body-subtle uppercase">Streaming schedule</p>
      <h2 class="mb-4 text-4xl leading-tight font-black tracking-tight wrap-break-word text-on-light-heading">
        Floofy Standard Time
      </h2>
    </div>

    <div class="grid gap-6 md:grid-cols-3">
      <article class="stream-schedule-card">
        <p class="stream-label">Eastern Time</p>
        <h3 class="stream-time">{{ easternStreamTimeLabel }}</h3>
        <p class="stream-detail">Saturdays</p>
      </article>

      <article class="stream-schedule-card">
        <p class="stream-label">Japan Time</p>
        <h3 class="stream-time">{{ japanStreamTimeLabel }}</h3>
        <p class="stream-detail">Sunday morning</p>
      </article>

      <article class="stream-schedule-card stream-schedule-card--highlight">
        <p class="stream-label">Your local time</p>
        <h3 class="stream-time">{{ localStreamTime }}</h3>
        <p class="stream-detail">{{ localStreamDescription }}</p>
      </article>
    </div>
  </div>
</section>

<app-section-divider />

<app-section tone="dark">
  <div class="mx-auto max-w-7xl py-16">
    <div class="mb-8 text-center">
      <p class="mb-2 text-sm font-semibold tracking-[0.35em] text-on-dark-body-subtle uppercase">Live channel</p>
      <h2 class="mb-4 text-4xl leading-tight font-black tracking-tight wrap-break-word text-on-dark-heading">
        Watch live
      </h2>
    </div>

    <div class="card-shadow mx-auto max-w-7xl overflow-hidden rounded-4xl border border-white/10 bg-white/5">
      <div id="twitch-embed" #twitchEmbed></div>
    </div>
  </div>
</app-section>

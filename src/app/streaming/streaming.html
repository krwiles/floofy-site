<!-- Streaming Hero -->
<app-parallax-section
  class="bg-[#5A696E]"
  [backgroundImage]="'assets/intersecting-circles.svg'"
  [backgroundSize]="'100px'"
  [backgroundHeight]="'200%'"
  [parallaxStrength]="0.8"
  [ariaLabel]="'Hero Background'"
>
  <div class="absolute inset-0 mx-auto h-full max-w-7xl">
    <app-parallax-section
      class="absolute inset-0 ml-auto h-full max-w-5xl lg:mask-fade-x"
      [ariaLabel]="'Hero section'"
      [backgroundImage]="'assets/G0iHCdnaIAA5IDY.jpg'"
      [backgroundPosition]="'center 40%'"
      [backgroundHeight]="'110%'"
      [parallaxStrength]="0.65"
    ></app-parallax-section>
  </div>
  <div
    class="relative z-10 mx-auto flex min-h-[95svh] w-full max-w-7xl items-end justify-center text-left md:justify-start"
  >
    <div class="glass-panel hero-reveal-surface max-w-3xl px-6 py-6 drop-shadow-md sm:px-7 sm:py-7 md:mb-16">
      <span
        class="flourish f-full absolute top-0 left-1/2 z-10 hidden h-12 -translate-x-1/2 -translate-y-1/2 text-on-dark-heading md:inline-block"
        aria-hidden="true"
      ></span>
      <p
        class="hero-reveal-kicker mb-3 text-sm font-bold tracking-[0.32em] text-on-dark-heading uppercase sm:text-[0.95rem]"
      >
        {{ 'streaming.hero.kicker' | translate }}
      </p>
      <h1
        class="hero-reveal-title text-[clamp(3.4rem,10vw,5.75rem)] leading-[0.9] font-black tracking-[0.02em] text-on-dark-heading uppercase"
      >
        {{ 'streaming.hero.title' | translate }}
      </h1>
      <p class="hero-reveal-copy mt-4 max-w-[56ch] text-sm leading-7 text-on-dark-body sm:text-base">
        {{ 'streaming.hero.description' | translate }}
      </p>
      <p class="hero-reveal-copy mt-6 text-xs font-semibold tracking-[0.28em] text-on-dark-body uppercase sm:text-sm">
        {{ 'streaming.hero.tagline' | translate }}
      </p>
    </div>
  </div>
</app-parallax-section>

<section class="mx-auto flex w-full max-w-7xl justify-center px-8 pb-20">
  <!-- Twitch embed renders into this element -->
  <div id="twitch-embed" #twitchEmbed></div>
</section>
